name: Stock Swing Trading Bot

permissions:
  contents: write

on:
  schedule:
    # 14h35 UTC = 9h35 EST (5 min après l'ouverture US/Canada en heure d'hiver)
    # 17h00 UTC = 12h00 EST (mi-journée)
    # 19h45 UTC = 14h45 EST (1h15 avant la clôture de 16h00 EST)
    - cron: '35 14 * * 1-5'
    - cron: '0 17 * * 1-5'
    - cron: '45 19 * * 1-5'
  workflow_dispatch:

jobs:
  run-stock-bot:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade alpaca-py

      - name: Run Stock Swing Bot
        env:
          PYTHONUNBUFFERED: "1"
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python stock_main_runner.py

      - name: Commit and push updated stock bot state
        run: |
          git config --global user.name "GitHub Actions Stock Bot"
          git config --global user.email "actions@github.com"
          git add stock_bot_state.json || true
          git commit -m "Auto: Update stock bot state [skip ci]" || true
          git push origin main || echo "⚠️ Pas de changement d'état à commiter."

      - name: Notify Telegram on Workflow Failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d text="❌ *Échec critique du workflow GitHub Actions* (Stock Swing Trading Bot). Vérifiez les logs sur GitHub."
