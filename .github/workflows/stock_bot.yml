name: Stock Swing Trading Bot

on:
  schedule:
    # S'exécute du Lundi au Vendredi à 14h00, 17h00 et 19h45 UTC (adapté aux heures boursières US/Canada)
    - cron: '0 14,17 * * 1-5'
    - cron: '45 19 * * 1-5'
  workflow_dispatch:

jobs:
  run-stock-bot:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Stock Swing Bot
        env:
          PYTHONUNBUFFERED: "1"
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python stock_main_runner.py

      - name: Commit and push updated stock bot state
        run: |
          git config --global user.name "GitHub Actions Stock Bot"
          git config --global user.email "actions@github.com"
          git add stock_bot_state.json || true
          git commit -m "Auto: Update stock bot state [skip ci]" || true
          git push origin main || echo "⚠️ Pas de changement d'état à commiter."
